---
name: non-root-controller

on:
  push:
    branches:
    - test/13455-non-root-controller
    - test/13455-without-safe-directory
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - name: Fetch upstream version tags
      run: git fetch https://github.com/kubernetes-sigs/kubespray.git 'refs/tags/*:refs/tags/*'
    - uses: actions/setup-python@v6
      with:
        python-version: |
          3.12
          3.13
    - run: python -m pip install pre-commit
    - run: pre-commit run --hook-stage manual --all-files --show-diff-on-failure

  controller:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6
    - run: docker build -f pipeline.Dockerfile -t kubespray-pipeline:ci .
    - name: Check controller and affected CI paths
      run: |
        docker run --rm -v "$GITHUB_WORKSPACE:/source:ro" kubespray-pipeline:ci bash -euxo pipefail -c '
          test "$(id -u)" -ne 0
          ! sudo -n true
          ansible localhost --connection=local -m setup -a filter=ansible_user_uid
          cp -R /source /tmp/kubespray
          cd /tmp/kubespray
          ./tests/scripts/vagrant-validate.sh
          ./tests/scripts/opentofu_install.sh
          ansible-playbook tests/cloud_playbooks/create-kubevirt.yml --syntax-check
          pip install --no-compile --no-cache-dir pip -U
        '
    - name: Check Git access to a writable checkout owned by another UID
      run: |
        docker run --rm -v "$GITHUB_WORKSPACE:/source:ro" --user 0 kubespray-pipeline:ci bash -euxo pipefail -c '
          mkdir /tmp/checkout
          cp -R /source/.git /tmp/checkout/.git
          chown -R root:root /tmp/checkout
          chmod -R a+rwX /tmp/checkout
          su -s /bin/bash kubespray -c "git -C /tmp/checkout status --porcelain >/dev/null"
        '
